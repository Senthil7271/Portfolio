<svg width="600" height="750" viewBox="0 0 600 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D1C17" />
      <stop offset="50%" stop-color="#141411" />
      <stop offset="100%" stop-color="#0B0B0A" />
    </linearGradient>
    <pattern id="pcbGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#34332A" stroke-width="0.8" stroke-opacity="0.6" />
      <circle cx="40" cy="0" r="1.5" fill="#EAB308" fill-opacity="0.4" />
      <circle cx="0" cy="40" r="1.5" fill="#FACC15" fill-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="750" rx="24" fill="url(#bgGrad)" />
  <rect width="600" height="750" rx="24" fill="url(#pcbGrid)" />

  <!-- Outer Semiconductor Framing - Crisp Hairlines -->
  <rect x="24" y="24" width="552" height="702" rx="16" fill="none" stroke="#34332A" stroke-width="1.5" />
  <rect x="36" y="36" width="528" height="678" rx="12" fill="none" stroke="#D4A017" stroke-width="1" stroke-dasharray="8 6" stroke-opacity="0.5" />

  <!-- Corner Alignment Targets (Semiconductor Wafer Reticle) -->
  <g stroke="#FACC15" stroke-width="1.5" stroke-opacity="0.8">
    <path d="M 44 60 L 44 44 L 60 44" />
    <path d="M 556 60 L 556 44 L 540 44" />
    <path d="M 44 690 L 44 706 L 60 706" />
    <path d="M 556 690 L 556 706 L 540 706" />
    <circle cx="52" cy="52" r="3" fill="#FACC15" />
    <circle cx="548" cy="52" r="3" fill="#FACC15" />
    <circle cx="52" cy="698" r="3" fill="#FACC15" />
    <circle cx="548" cy="698" r="3" fill="#FACC15" />
  </g>

  <!-- Central Silhouette / Camera Frame -->
  <g transform="translate(150, 180)">
    <!-- Circuit Head Outline -->
    <path d="M 150 70 C 105 70, 70 105, 70 150 C 70 185, 92 215, 125 225 C 65 245, 20 300, 10 380 L 290 380 C 280 300, 235 245, 175 225 C 208 215, 230 185, 230 150 C 230 105, 195 70, 150 70 Z" 
          fill="#141411" stroke="#EAB308" stroke-width="2" stroke-opacity="0.6" />
    
    <!-- Conductive Traces across Silhouette -->
    <path d="M 150 70 L 150 225 M 100 150 L 200 150 M 60 300 L 240 300 M 40 340 L 260 340" 
          stroke="#FACC15" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="4 4" />
    
    <!-- Central Chip Core Icon -->
    <rect x="130" y="130" width="40" height="40" rx="6" fill="#1D1C17" stroke="#FACC15" stroke-width="1.5" />
    <circle cx="150" cy="150" r="6" fill="#EAB308" />
  </g>

  <!-- Text Hierarchy -->
  <g text-anchor="middle" font-family="'Space Grotesk', 'Inter', sans-serif">
    <text x="300" y="470" font-size="14" letter-spacing="4" fill="#FACC15" font-weight="600">
      ENGINEERING PORTRAIT SLOT
    </text>
    <text x="300" y="505" font-size="28" letter-spacing="2" fill="#F5F1E6" font-weight="700">
      YOUR PORTRAIT HERE
    </text>
    <text x="300" y="540" font-size="13" fill="#A6A397" letter-spacing="1">
      /public/images/profile/profile-photo.webp
    </text>
    <text x="300" y="565" font-size="11" fill="#6B695E" letter-spacing="0.5">
      Supports easy drop-in replacement with automatic rim lighting
    </text>
  </g>

  <!-- Technical Reticle Metrics -->
  <g font-family="'JetBrains Mono', monospace" font-size="10" fill="#6B695E">
    <text x="50" y="90">SEC: BGA-PKG-2026</text>
    <text x="50" y="105">RES: 600x750 px</text>
    <text x="550" y="90" text-anchor="end">DIE_T: 28nm FINFET</text>
    <text x="550" y="105" text-anchor="end">THEME: TESLA_GOLD</text>
    <text x="50" y="660">LAT: 13.0827° N</text>
    <text x="50" y="675">LON: 80.2707° E</text>
    <text x="550" y="660" text-anchor="end">CHENNAI_INDIA</text>
    <text x="550" y="675" text-anchor="end">STATUS: READY</text>
  </g>

  <!-- Dynamic Gold Edge Rim Highlight (Hairlines) -->
  <path d="M 24 150 L 24 24 L 150 24" stroke="#FACC15" stroke-width="2" stroke-linecap="round" />
  <path d="M 576 600 L 576 726 L 450 726" stroke="#D4A017" stroke-width="2" stroke-linecap="round" />
</svg>